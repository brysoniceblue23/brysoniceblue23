name: computer-use-agent

on:
  push:
    branches: [main]
    paths:
      - "computer_use_agent/**"
      - ".github/workflows/computer-use-agent.yml"
  pull_request:
    paths:
      - "computer_use_agent/**"
      - ".github/workflows/computer-use-agent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    defaults:
      run:
        working-directory: computer_use_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q
